[project]
name = "prediction-market-mcp"
version = "0.1.0"
description = "MCP server: Kalshi fee math, live public market data, and two-leg position tools for AI agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
prediction-market-mcp = "pm_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pm_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real Kalshi public API (deselected by default)"]
addopts = "-m 'not live'"
